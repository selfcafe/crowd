*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Noto Sans JP","Helvetica Neue",Arial,"Hiragino Kaku Gothic ProN","Hiragino Sans",YuGothic,"Yu Gothic",Meiryo,sans-serif;

body.in-frame{background:transparent}

.lead{margin:8px 0 0;color:var(--sub);font-size:14px}
.demo{margin:12px 0 0;padding:8px 12px;border-radius:8px;background:#fff6d6;border:1px solid #e8d28a;color:#6b5400;font-size:13px}

.btn{appearance:none;border:0;border-bottom:3px solid var(--gold);border-radius:7px;background:var(--g);color:#fff;font:inherit;font-weight:700;font-size:13px;

.btn:disabled{opacity:.6;cursor:wait}

.near form{display:flex;gap:6px;flex:1;min-width:min(100%,260px)}

.near input:focus{outline:2px solid var(--lime);outline-offset:0;border-color:var(--g)}
.near-msg{margin:0;font-size:13px;color:var(--muted)}
.near-msg:empty{display:none}
.list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:0;padding:0;list-style:none}
.list:empty{display:none}

.name{margin:0;font-size:16px;font-weight:700;color:var(--g2);line-height:1.4;overflow-wrap:anywhere}
.name small{font-size:12px;font-weight:400;color:var(--muted);margin-left:2px}
.dist{display:block;font-family:"Jost","Noto Sans JP",sans-serif;font-size:13px;font-weight:600;color:var(--sub)}
.gauge{display:grid;grid-template-columns:repeat(5,1fr);gap:3px}
.gauge i{display:block;height:14px;border-radius:3px;background:#e6e4dc}
.when{margin:0;font-size:12px;color:var(--muted);display:flex;justify-content:space-between;align-items:baseline;gap:4px 8px;flex-wrap:wrap}
.when b{font-family:"Jost","Noto Sans JP",sans-serif;font-weight:600;color:var(--sub);font-size:14px}
.when a{color:var(--g);font-weight:700;text-decoration:none;border-bottom:1px solid var(--gold)}
.state{margin:0;font-size:12px;font-weight:700;color:var(--muted)}
.msg{grid-column:1/-1;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px;text-align:center;color:var(--sub);font-size:14px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin:16px 0 0;padding:0;list-style:none;font-size:12px;color:var(--sub)}
.legend li{display:flex;align-items:center;gap:5px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.notes{margin:14px 0 0;padding:12px 14px;border-top:2px dashed var(--line);font-size:12px;color:var(--muted);display:grid;gap:4px}
.notes p{margin:0}

<div class="wrap">

      </div>
      <p class="near-msg" data-k="nearmsg" aria-live="polite"></p>
    </div>
    <ul class="list" data-k="near" aria-live="polite" style="margin-top:12px"></ul>
  </section>
  <section class="sec" aria-labelledby="all-h">
    <h2 id="all-h">混み具合を表示している店</h2>

    <ul class="list" data-k="list" aria-live="polite"></ul>
  </section>
  <ul class="legend" data-k="legend" aria-label="段階の見かた"></ul>
  <div class="notes">
    <p>※カメラ映像をもとにした目安です。実際の混み具合と異なる場合があります。</p>
    <p>※映像は判定にだけ使い、保存・公開はしていません。現在地は近い店を探すためだけに使い、送信・保存はしていません。</p>
    <p>※判定の時間外や、判定が止まっているときは、混み具合を表示しません。</p>
  </div>
</div>

  var q = new URLSearchParams(location.search);

  }
  function jstNow() {

  }
  function stateOf(s, now) {

  }
  function load() {
    btn.disabled = true;
    if (isDemo) { render(demo()); btn.disabled = false; return; }

    }).then(function () { btn.disabled = false; });
  }

  setInterval(function () { if (!document.hidden) load(); }, REFRESH_MS);
  document.addEventListener("visibilitychange", function () { if (!document.hidden) load(); });
})();
